<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timer — LGS Round Timer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Barlow:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Theme variables (dark default — good for a TV/monitor) ── */
    :root {
      --bg:             #0e0e14;
      --bg-card:        #16161e;
      --border:         rgba(255,255,255,0.08);
      --accent:         #e05c2a;
      --accent-dim:     #f0a07a;
      --text:           #f0ecf8;
      --text-dim:       rgba(255,255,255,0.45);
      --color-running:  #2a9d5c;
      --color-paused:   #e0a020;
      --color-expired:  #d0282a;
      --color-idle:     #5a5670;
      --progress-bg:    rgba(255,255,255,0.1);
      --transition:     180ms ease;
    }

    /* Light theme override */
    body.theme-light {
      --bg:          #f0ede8;
      --bg-card:     #ffffff;
      --border:      #d8d3cc;
      --text:        #1a1a1f;
      --text-dim:    #6b6770;
      --progress-bg: #e4e0da;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      overflow: hidden;
      transition: background var(--transition);
    }

    /* ── Wrapper — fills the whole window ── */
    .popout-wrap {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 18px 20px 14px;
      gap: 10px;
      border-top: 4px solid var(--color-idle);
      transition: border-top-color var(--transition);
    }

    /* Status-driven border */
    .popout-wrap[data-status="running"] { border-top-color: var(--color-running); }
    .popout-wrap[data-status="paused"]  { border-top-color: var(--color-paused);  }
    .popout-wrap[data-status="expired"] { border-top-color: var(--color-expired); }

    /* Warning pulse */
    .popout-wrap.warning { animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { box-shadow: none; }
      50%       { box-shadow: inset 0 0 0 3px rgba(208,40,42,0.35); }
    }

    /* ── Header row: label pill + game name ── */
    .popout-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .popout-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-dim);
      background: rgba(224,92,42,0.12);
      padding: 2px 10px;
      border-radius: 20px;
    }

    .popout-game {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text);
      opacity: 0.8;
    }

    /* ── Countdown — the main event, fills remaining height ── */
    .popout-time {
      font-family: 'Rajdhani', sans-serif;
      /* Fills remaining space and scales the font to match */
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(4rem, 22vw, 14rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1;
      color: var(--text);
      transition: color var(--transition);
    }

    [data-status="running"] .popout-time { color: var(--color-running); }
    [data-status="paused"]  .popout-time { color: var(--color-paused);  }
    [data-status="expired"] .popout-time { color: var(--color-expired); }
    .warning .popout-time               { color: var(--color-expired); }

    /* ── Progress bar ── */
    .popout-progress {
      height: 6px;
      background: var(--progress-bg);
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .popout-progress-fill {
      height: 100%;
      background: var(--color-running);
      border-radius: 10px;
      transition: width 0.5s linear, background var(--transition);
    }

    [data-status="paused"] .popout-progress-fill { background: var(--color-paused); }
    .warning .popout-progress-fill               { background: var(--color-expired); }

    /* ── Status label ── */
    .popout-status {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      text-align: center;
      flex-shrink: 0;
      transition: color var(--transition);
    }

    [data-status="running"] .popout-status { color: var(--color-running); }
    [data-status="paused"]  .popout-status { color: var(--color-paused);  }
    [data-status="expired"] .popout-status { color: var(--color-expired); }
    .warning .popout-status               { color: var(--color-expired); }

    /* ── "Waiting" screen shown before first broadcast arrives ── */
    .popout-waiting {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0.3;
    }
    .popout-waiting__icon { font-size: 3rem; }
    .popout-waiting__text { font-size: 1rem; font-weight: 500; }
  </style>
</head>
<body>

  <!-- Main display — hidden until a broadcast arrives -->
  <div id="popout-wrap" class="popout-wrap" data-status="idle" hidden>
    <div class="popout-header">
      <span id="po-label" class="popout-label"></span>
      <span id="po-game"  class="popout-game"></span>
    </div>
    <div id="po-time"   class="popout-time">00:00</div>
    <div class="popout-progress">
      <div id="po-fill" class="popout-progress-fill" style="width:100%"></div>
    </div>
    <div id="po-status" class="popout-status">Ready</div>
  </div>

  <!-- Shown while waiting for the main window to send data -->
  <div id="popout-waiting" class="popout-waiting">
    <div class="popout-waiting__icon">📡</div>
    <p class="popout-waiting__text">Waiting for timer data…<br>Keep the main app open.</p>
  </div>

  <script type="module" src="/src/popout.js"></script>
</body>
</html>
