<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timer — LGS Round Timer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Barlow:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    :root {
      --bg:             #0e0e14;
      --accent:         #e05c2a;
      --accent-dim:     #f0a07a;
      --text:           #f0ecf8;
      --text-dim:       rgba(255,255,255,0.45);
      --color-running:  #2a9d5c;
      --color-paused:   #e0a020;
      --color-expired:  #d0282a;
      --color-idle:     #5a5670;
      --progress-bg:    rgba(255,255,255,0.1);
      --transition:     180ms ease;
    }

    body.theme-light {
      --bg:          #f0ede8;
      --text:        #1a1a1f;
      --text-dim:    #6b6770;
      --progress-bg: #e4e0da;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      overflow: hidden;
      transition: background var(--transition);
    }

    /* ── Main wrapper ── */
    .popout-wrap {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      border-top: 4px solid var(--color-idle);
      transition: border-top-color var(--transition);
      overflow: hidden;
    }

    .popout-wrap[data-status="running"] { border-top-color: var(--color-running); }
    .popout-wrap[data-status="paused"]  { border-top-color: var(--color-paused);  }
    .popout-wrap[data-status="expired"] { border-top-color: var(--color-expired); }
    .popout-wrap[data-status="overtime"]{ border-top-color: var(--color-expired); }

    .popout-wrap.warning  { animation: pulse 2s infinite; }
    .popout-wrap.overtime { border-top-color: var(--color-expired) !important; animation: pulse 1s infinite; }
    @keyframes pulse {
      0%, 100% { box-shadow: none; }
      50%       { box-shadow: inset 0 0 0 3px rgba(208,40,42,0.35); }
    }

    /* ── Top bar: timer name + game — always visible, fixed height ── */
    .popout-topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px 8px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .popout-label {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-dim);
      background: rgba(224,92,42,0.12);
      padding: 3px 12px;
      border-radius: 20px;
    }

    .popout-game {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text);
      opacity: 0.85;
    }

    /* ── Logo — centered block, takes as much space as available ── */
    .popout-image {
      display: block;
      /* Fills remaining height between topbar and countdown */
      flex: 1;
      min-height: 0;
      width: 100%;
      object-fit: contain;
      padding: 8px 24px;
    }

    /* ── Countdown ── */
    .popout-time {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(5rem, 30vw, 20rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1;
      text-align: center;
      color: var(--text);
      transition: color var(--transition);
      padding: 0 18px 6px;
      flex-shrink: 0;
    }

    /* When there is NO logo the countdown should fill remaining space */
    .popout-wrap.no-image .popout-time {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    [data-status="running"]  .popout-time { color: var(--color-running); }
    [data-status="paused"]   .popout-time { color: var(--color-paused);  }
    [data-status="expired"]  .popout-time { color: var(--color-expired); }
    [data-status="overtime"] .popout-time { color: var(--color-expired); }
    .warning  .popout-time               { color: var(--color-expired); }
    .overtime .popout-time               { color: var(--color-expired); }

    /* ── Progress bar ── */
    .popout-progress {
      height: 6px;
      background: var(--progress-bg);
      flex-shrink: 0;
      overflow: hidden;
    }

    .popout-progress-fill {
      height: 100%;
      background: var(--color-running);
      transition: width 0.5s linear, background var(--transition);
    }

    [data-status="paused"] .popout-progress-fill { background: var(--color-paused); }
    .warning  .popout-progress-fill              { background: var(--color-expired); }
    .overtime .popout-progress-fill              { background: var(--color-expired); }

    /* ── Status label ── */
    .popout-status {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      text-align: center;
      flex-shrink: 0;
      padding: 6px 0 10px;
      transition: color var(--transition);
    }

    [data-status="running"]  .popout-status { color: var(--color-running); }
    [data-status="paused"]   .popout-status { color: var(--color-paused);  }
    [data-status="expired"]  .popout-status { color: var(--color-expired); }
    [data-status="overtime"] .popout-status { color: var(--color-expired); }
    .warning  .popout-status               { color: var(--color-expired); }
    .overtime .popout-status               { color: var(--color-expired); }

    /* ── Waiting screen ── */
    .popout-waiting {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0.3;
    }
    .popout-waiting__icon { font-size: 3rem; }
    .popout-waiting__text { font-size: 1rem; font-weight: 500; }
  </style>
</head>
<body>

  <div id="popout-wrap" class="popout-wrap no-image" data-status="idle" hidden>

    <!-- Top bar: always at the top, name + game -->
    <div class="popout-topbar">
      <span id="po-label" class="popout-label"></span>
      <span id="po-game"  class="popout-game"></span>
    </div>

    <!-- Logo: fills the middle section, hidden when no image set -->
    <img id="po-image" class="popout-image" src="" alt="" hidden />

    <!-- Countdown -->
    <div id="po-time" class="popout-time">00:00</div>

    <!-- Progress bar -->
    <div class="popout-progress">
      <div id="po-fill" class="popout-progress-fill" style="width:100%"></div>
    </div>

    <!-- Status -->
    <div id="po-status" class="popout-status">Ready</div>
  </div>

  <div id="popout-waiting" class="popout-waiting">
    <div class="popout-waiting__icon">📡</div>
    <p class="popout-waiting__text">Waiting for timer data…<br>Keep the main app open.</p>
  </div>

  <script type="module" src="/src/popout.js"></script>
</body>
</html>
